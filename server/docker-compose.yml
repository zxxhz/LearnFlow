version: "3.8"

services:
  # ========================================================
  # LearnFlow 云端中转服务端 (含完整 Web SPA 前端界面)
  # ========================================================
  learnflow-relay:
    # 默认从 GitHub Packages (GHCR) 拉取自动构建的一体化镜像
    image: ghcr.io/zxxhz/learnflow-server:latest
    container_name: learnflow-relay
    restart: unless-stopped
    # 核心：启动或重启时自动拉取最新镜像（实现开机即最新）
    pull_policy: always
    # 如需在本地源码重新编译，可解开下三行注释：
    # build:
    #   context: ..
    #   dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT:-8421}:8421"
    environment:
      - SERVER_PORT=8421
      # 访问安全 Token（建议外网部署配置复杂密码；若为空且 RELAY_AUTH_REQUIRED=false 则开放免密）
      - RELAY_SERVER_TOKEN=${RELAY_SERVER_TOKEN:-}
      # 是否强制启用 Token 鉴权（true / false，默认 false）
      - RELAY_AUTH_REQUIRED=${RELAY_AUTH_REQUIRED:-false}
      # AI 执行模式: auto (默认，本地在线走本地，离线走云端) | cloud (强制云端) | local (强制本地)
      - AI_MODE=${AI_MODE:-auto}
      # 提示：大模型 API（Base URL / Key / Model）直接在 Web 网页端或电脑桌面端「设置」中随时在线修改，
      # 会自动持久化保存到挂载的 ./data 卷中，无需在 compose 中硬编码密钥。
      # 系统在线更新配置
      - GITHUB_REPO=zxxhz/LearnFlow
      - DATA_DIR=/app/data
      - STATIC_DIR=/app/static
    volumes:
      # 持久化存储云端 SQLite 数据库、错题/讲义缓存及大模型配置 (server_config.json)
      - ./data:/app/data
      # 核心：直接挂载宿主机 Docker 通信管道，服务端直连 Docker 引擎完成在线一键热更新
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8421/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
