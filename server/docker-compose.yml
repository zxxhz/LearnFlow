version: "3.8"

services:
  # ========================================================
  # 1. LearnFlow 云端中转服务端 (对外 Web 界面与 API 业务容器)
  #    【安全设计】：不挂载宿主机 docker.sock，杜绝特权逃逸风险！
  # ========================================================
  learnflow-relay:
    image: ghcr.io/zxxhz/learnflow-server:latest
    container_name: learnflow-relay
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${SERVER_PORT:-8421}:8421"
    environment:
      - SERVER_PORT=8421
      # 安全访问密码（建议配置复杂密码；留空且 RELAY_AUTH_REQUIRED=false 则免密开放）
      - RELAY_SERVER_TOKEN=${RELAY_SERVER_TOKEN:-}
      - RELAY_AUTH_REQUIRED=${RELAY_AUTH_REQUIRED:-false}
      - AI_MODE=${AI_MODE:-auto}
      # 安全更新通信：通过 Docker 内部虚拟网络向独立的 Watchtower 触发热更新
      - WATCHTOWER_URL=http://watchtower:8080/v1/update
      - WATCHTOWER_TOKEN=${WATCHTOWER_TOKEN:-learnflow_update_secret}
      - DATA_DIR=/app/data
      - STATIC_DIR=/app/static
    volumes:
      # 持久化存储 SQLite 数据库、讲义缓存及云端大模型配置 (server_config.json)
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8421/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # 2. Watchtower 安全更新运维容器 (内部专用，不暴露公网端口)
  #    【安全设计】：由专职运维容器持有 docker.sock，且仅响应内网带 Token 的 API 触发
  # ========================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: learnflow-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 显式声明 Docker API 协议版本，解决高版本 Docker Daemon 报 client version 1.25 is too old
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true         # 更新后自动清理无用旧镜像，释放磁盘空间
      - WATCHTOWER_LABEL_ENABLE=true    # 仅更新带有 enable=true 标签的容器，不干扰宿主机其他服务
      - WATCHTOWER_HTTP_API_UPDATE=true # 开启内网 HTTP API 触发模式，供网页/桌面端点击一键更新
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:-learnflow_update_secret}
      # 默认巡检间隔设为 1 天（主要依靠 Web 端点击触发更新，如需自动轮询可改为 300 即 5分钟）
      - WATCHTOWER_POLL_INTERVAL=86400
