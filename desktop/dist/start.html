<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LearnFlow 启动中</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f9fafb;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #374151;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #4f46e5;
        color: #fff;
        font-size: 40px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spin {
        width: 26px;
        height: 26px;
        border: 3px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: s 0.9s linear infinite;
      }
      @keyframes s {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        font-size: 14px;
        color: #6b7280;
      }
      #err {
        display: none;
        max-width: 460px;
        font-size: 13px;
        line-height: 1.7;
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 10px;
        padding: 14px 18px;
      }
    </style>
  </head>
  <body>
    <div class="logo">L</div>
    <div class="spin"></div>
    <div id="msg">正在启动本地服务…</div>
    <div id="err">
      本地服务未能启动。请尝试重新安装 LearnFlow；若反复出现，欢迎到
      <a href="https://github.com/zxxhz/LearnFlow/issues">GitHub Issues</a> 反馈。<br />
      <span style="color:#9ca3af">开发模式：请确认已安装 uv，且能在 backend/ 目录运行
      <code>uv run python -m app.main</code> 查看报错。</span>
    </div>
    <script>
      // 30 秒仍未就绪则提示排查（成功时由壳直接跳转页面）
      setTimeout(() => {
        document.getElementById("msg").style.display = "none";
        document.getElementById("err").style.display = "block";
      }, 30000);
    </script>
  </body>
</html>
